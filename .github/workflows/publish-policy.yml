name: Validate policy lists

# Signing is NOT done here: the private key is deliberately kept off GitHub, so
# that hosting the lists and signing them stay separate. Publication happens on
# the publisher's machine (see README, "Signing and publication").

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - policy/**
      - '*.lst'
      - '*.lst.sig'
      - tools/publish_policy.py
      - tools/test_publish_policy.py
      - tools/policy-requirements.txt
      - .gitattributes
      - .github/workflows/publish-policy.yml
  pull_request:
    paths:
      - policy/**
      - '*.lst'
      - '*.lst.sig'
      - tools/publish_policy.py
      - tools/test_publish_policy.py
      - tools/policy-requirements.txt
      - .gitattributes
      - .github/workflows/publish-policy.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install signature verifier
        run: python3 -m pip install -r tools/policy-requirements.txt
      - name: Test signing, serials and failure handling
        run: python3 -m unittest discover -s tools -p 'test_publish_policy.py' -v
      - name: Check published signatures and pending sources
        run: python3 tools/publish_policy.py --check
